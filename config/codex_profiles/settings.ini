; ============================================
; Codex 预设额外设置
; --------------------------------------------
; shared_template.enabled=1 时：
; - 切出任意一套成员预设前，会把当前 live config.toml 视为“公共模板来源”。
; - 然后把公共配置同步到 member_ids 里的所有预设。
; - 各预设只保留 profiles.ini 中声明的 provider 差异。
; - auth.json 仍只回写当前来源预设，不跨 provider 扩散。
; ============================================

[shared_template]
enabled=1
member_ids=haibao,openai_official,right_code,heweiyi
