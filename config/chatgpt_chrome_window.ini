; ============================================
; ChatGPT Chrome 浮窗配置
; --------------------------------------------
; 这份文件只保存“功能配置”，例如：
; - 访问地址；
; - Chrome 启动模式；
; - 默认窗口尺寸；
; - 使用哪个 Chrome Profile。
;
; 用户手动拖动/缩放后的“最后一次窗口位置和大小”
; 不写在这里，而是写入 logs\chatgpt_chrome_window_state.ini。
; 这样做的原因是：
; 1) 这里保持“可读、可 review 的静态配置”；
; 2) 状态文件可以高频更新，而不污染真正配置。
; ============================================

[launch]
; ChatGPT 入口地址。
; 默认使用官方 chatgpt.com。
url=https://chatgpt.com/

; Chrome 可执行文件路径。
; 留空表示脚本自动尝试以下常见位置：
; 1) C:\Program Files\Google\Chrome\Application\chrome.exe
; 2) C:\Program Files (x86)\Google\Chrome\Application\chrome.exe
; 3) %LOCALAPPDATA%\Google\Chrome\Application\chrome.exe
chrome_path=

; 复用 Chrome 的默认正常 Profile。
; 你要求“不新建 Profile”，因此默认就是 Default。
profile_directory=Default

; 窗口模式：
; - window：普通浏览器窗口，支持多个标签页；这是当前默认值。
; - app：更像桌面 App，但标签页能力会受限。
window_mode=window

; 从启动 Chrome 到等待新窗口出现的最长时间（毫秒）。
startup_timeout_ms=8000

[window]
; 第一次启动、或者没有历史位置时使用的默认宽高。
default_width=1180
default_height=820

; 是否强制保持置顶。
; 1 = 是，0 = 否。
always_on_top=1
