; ============================================
; ChatGPT Chrome 浮窗配置
; --------------------------------------------
; 这份文件只保存“功能配置”，例如：
; - 访问地址；
; - Chrome 启动模式；
; - 默认窗口尺寸；
; - 使用哪个 Chrome User Data / Profile；
; - 是否打开本机 CDP 调试端口；
; - 是否把 ChatGPT 浮窗里打开的新外链转交给 Firefox。
;
; 用户手动拖动/缩放后的“最后一次窗口位置和大小”
; 不写在这里，而是写入 logs\chatgpt_chrome_window_state.ini。
; 这样做的原因是：
; 1) 这里保持“可读、可 review 的静态配置”；
; 2) 状态文件可以高频更新，而不污染真正配置。
; ============================================

[launch]
; ChatGPT 入口地址。
; 默认使用官方 chatgpt.com。
url=https://chatgpt.com/

; Chrome 可执行文件路径。
; 留空表示脚本自动尝试以下常见位置：
; 1) C:\Program Files\Google\Chrome\Application\chrome.exe
; 2) C:\Program Files (x86)\Google\Chrome\Application\chrome.exe
; 3) %LOCALAPPDATA%\Google\Chrome\Application\chrome.exe
chrome_path=

; Chrome User Data 根目录。
; 这里故意不使用 Chrome 原始默认目录，而是使用 D 盘上的日常 CDP 目录。
; 原因：
; 1) Chrome 136 之后不再允许默认数据目录直接开启远程调试端口；
; 2) 独立目录可以长期打开 9222 调试端口，方便 Codex / MCP / AHK 脚本接入；
; 3) 放到 D 盘可以减少 C 盘缓存和历史数据压力。
user_data_dir=D:\AppData\Chrome\Chrome-CDP\User Data

; User Data 目录里面的 Profile 子目录。
; 注意：这里的 Default 是“上面这个 user_data_dir 里的 Default 子目录”，
; 不是 Windows/Chrome 原始默认数据目录。
profile_directory=Default

; 本机 CDP 调试端口。
; 127.0.0.1 只允许本机脚本连接，避免局域网其他设备碰到浏览器调试接口。
remote_debugging_port=9222
remote_debugging_address=127.0.0.1

; 首次启动新 User Data 时不要弹首次使用流程。
no_first_run=1

; 不提示“把 Chrome 设为默认浏览器”；默认浏览器继续由 Firefox 承担。
no_default_browser_check=1

; 窗口模式：
; - window：普通浏览器窗口，支持多个标签页；这是当前默认值。
; - app：更像桌面 App，但标签页能力会受限。
window_mode=app

; 从启动 Chrome 到等待新窗口出现的最长时间（毫秒）。
startup_timeout_ms=8000

[window]
; 第一次启动、或者没有历史位置时使用的默认宽高。
default_width=540
default_height=760

; 是否强制保持置顶。
; 1 = 是，0 = 否。
always_on_top=1

; 是否禁用右上角关闭按钮。
; 1 = 禁用。这样误点 X 时不会直接关闭并刷新整个页面状态；
;     真正想关闭时，请从 AHK 托盘菜单里点“彻底关闭 ChatGPT 浮窗”。
; 0 = 保持 Chrome 默认行为。
disable_close_button=1

[external_links]
; 是否启用“ChatGPT 浮窗外链转 Firefox”路由器。
; 1 = 启用：AHK 会尝试启动 tools\chatgpt_external_link_router.mjs；
; 0 = 禁用：Chrome 自己处理外链。
enabled=1

; Firefox 路径留空时，路由脚本会优先尝试 `firefox.exe`。
firefox_path=

; Node 路径留空时，AHK 会优先尝试系统 PATH 里的 `node.exe`。
node_path=
